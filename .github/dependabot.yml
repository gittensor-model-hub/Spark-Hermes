version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current: Dependabot bumps the commit SHA and
  # its `# vX.Y.Z` comment together, so pinning stays maintainable.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Python dependencies (uv-managed): updates pyproject.toml and uv.lock together so
  # the `uv sync --frozen` used by every workflow stays consistent.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
