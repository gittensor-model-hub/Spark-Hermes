name: crown

# Trusted operator jobs only. The active round is persisted by strategy.yml.
# The dedicated runner must mount a private durable local filesystem at SPARK_STATE_ROOT.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      deliver:
        description: "Explicitly deliver pending GitHub actions (default only records intent)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spark-competition-state
  cancel-in-progress: false

jobs:
  settle:
    runs-on: [self-hosted, linux, spark-validator]
    environment: competition-validator
    env:
      SPARK_STATE_ROOT: ${{ vars.SPARK_STATE_ROOT }}
      SPARK_PYTHON: ${{ vars.SPARK_PYTHON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check trusted external interpreter and durable state
        shell: bash
        run: bash scripts/competition-environment.sh
      - name: Require durable private state
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SPARK_STATE_ROOT" = /* && "$SPARK_STATE_ROOT" != /tmp* ]]
          test -f "$SPARK_STATE_ROOT/rounds/.identity"
          test -f "$SPARK_STATE_ROOT/settlement/settlement.sqlite3"
      - name: Commit active round and outbox
        run: >-
          "$SPARK_PYTHON" -m validator.crown select
          --store "$SPARK_STATE_ROOT/rounds"
          --settlement-root "$SPARK_STATE_ROOT/settlement"
          --scorecards "$SPARK_STATE_ROOT/scorecards"
          --episodes "$SPARK_STATE_ROOT/judge"
          --out "$SPARK_STATE_ROOT/latest-settlement.json"
      - name: Pending intent (no external mutations)
        run: >-
          "$SPARK_PYTHON" -m validator.settlement deliver
          --settlement-root "$SPARK_STATE_ROOT/settlement"

  deliver:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deliver }}
    needs: settle
    runs-on: [self-hosted, linux, spark-validator]
    environment: competition-delivery
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      SPARK_STATE_ROOT: ${{ vars.SPARK_STATE_ROOT }}
      SPARK_PYTHON: ${{ vars.SPARK_PYTHON }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check trusted external interpreter and durable state
        shell: bash
        run: bash scripts/competition-environment.sh
      - name: Reconcile and deliver committed actions
        env:
          # Configured bot credential must support authenticated /user identity reads.
          GH_TOKEN: ${{ secrets.COMPETITION_ACTION_TOKEN }}
        run: >-
          "$SPARK_PYTHON" -m validator.settlement deliver
          --settlement-root "$SPARK_STATE_ROOT/settlement"
          --allow-external --credential-env GH_TOKEN
