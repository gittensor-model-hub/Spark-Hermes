name: crown

# One crown an hour.
#
# Score every evaluated submission, keep exactly one, close the rest, move the label, open the next
# round. One miner is rewarded per hour and everyone else starts again.
#
# A barren hour leaves the crown where it is and runs the same task again -- it says nothing about
# the miner who last cleared the bar. Two barren hours rotate the task, because that is evidence
# about the task rather than the field.
#
# Not on merge. A merge grants nothing by itself, which keeps the crown off the submission path --
# a mistake here mislabels or wrongly closes a pull request rather than blocking intake.
#
# :23 rather than :00 -- the hour mark is where every scheduled job on the platform lands and this
# one has no reason to queue behind them.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Score and print the actions without moving labels or closing anything"
        type: boolean
        default: false

permissions:
  contents: read
  # Enough to label and close, and nothing that can advance a ref. This job decides who won; it
  # must not be able to merge anything.
  pull-requests: write

concurrency:
  # One at a time, and never cancelled mid-flight. Two overlapping runs would each score against
  # the other's half-applied closures, and a cancelled run can leave the old crown removed with the
  # new one never added -- an hour with no crown at all, for the wrong reason.
  group: crown
  cancel-in-progress: false

jobs:
  crown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --frozen

      - name: Score the field
        run: uv run python -m validator.crown select --out /tmp/crowns.json | tee /tmp/standings.txt

      - name: Work out the actions
        run: uv run python -m validator.crown actions --out /tmp/crowns.json > /tmp/actions.txt 2>/tmp/skipped.txt || true

      - name: Apply
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # Label removals first: a crown only ever added is a crown two people hold at once.
          grep '^label remove ' /tmp/actions.txt | while read -r _ _ label pr; do
            gh pr edit "${pr#\#}" --remove-label "${label}" || true
          done
          grep '^label add ' /tmp/actions.txt | while read -r _ _ label pr; do
            gh pr edit "${pr#\#}" --add-label "${label}" || true
          done
          # Closures carry the reason. A pull request closed with no reason is a miner who learns
          # nothing from losing and resubmits the same thing next hour.
          grep '^close ' /tmp/actions.txt | while read -r _ pr reason; do
            gh pr comment "${pr#\#}" --body "Round closed. ${reason}" || true
            gh pr close "${pr#\#}" || true
          done

      - name: Report
        if: always()
        run: |
          {
            echo '### Crown'
            echo '```'
            cat /tmp/standings.txt
            echo '```'
            echo '### Actions'
            echo '```'
            cat /tmp/actions.txt
            echo '```'
            if [ -s /tmp/skipped.txt ]; then
              echo '### Not acted on'
              echo '```'
              cat /tmp/skipped.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
