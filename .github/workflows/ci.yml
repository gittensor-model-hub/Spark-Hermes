name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege: this job runs untrusted PR code (the test suite), so it gets a
# read-only token and no secrets. Never use pull_request_target here — the code /
# quality gate must not expose credentials to fork PRs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback, separated deliberately. These take ~2 minutes and used to sit in front of a
  # 51-minute test step in the same job, so a one-line formatting fault was reported as a failure
  # of "lint-type-test" after the whole suite had been queued behind it. A dangling AGENTS.md
  # symlink killed `ruff format` in 10 seconds and still cost a full CI cycle to learn.
  lint-type:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        # --extra validator so pyright can resolve validator/ imports (fastapi), the same
        # reason as proof below: an unresolvable import is a type error, and excluding the
        # package instead would stop type-checking the one process that serves requests.
        # --extra proof so pyright can resolve proof/ imports (pyjwt, dcap-qvl,
        # nv-attestation-sdk). SparkProof itself is not installed here, so the tests
        # that need it skip by design (see tests/conftest.py) — no secret exposure.
        run: uv sync --extra dev --extra proof --extra validator --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright type check
        run: uv run pyright
      - name: Offline CPU pipeline self-check
        run: uv run python -m admin.cli selfcheck
      - name: Build distributable package
        run: uv build --wheel
      - name: Verify installed package outside the checkout
        run: |
          uv pip install --reinstall --no-deps dist/*.whl
          cd /tmp
          "$GITHUB_WORKSPACE/.venv/bin/spark-hermes" selfcheck

  # The suite is ~4000 tests and 51 minutes on one runner. `pytest-xdist` cannot shorten that:
  # `admin.runtime_protocol.campaign_lock` is a single global file lock, so in-process workers
  # would serialise on it or deadlock. Separate RUNNERS have separate filesystems and therefore
  # separate locks, which is why the split is at the job level and not inside pytest.
  #
  # Shards are by MEASURED cost. Timed per shard on one host: 291 tests take ~48 minutes and the
  # other 3716 take ~5. test_cycles.py alone is ~1200s and is therefore the floor -- no
  # arrangement of the rest gets wall time below it. See tests/shards.py for the numbers and for
  # why a --durations top-25 sample is not a substitute for timing the shards.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [cycles, campaign, release, core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev --extra proof --extra validator --frozen
      - name: Pytest (${{ matrix.shard }})
        run: uv run python tests/shards.py run ${{ matrix.shard }}

  # A shard that silently runs nothing still reports success, and three green jobs would then
  # mean less than the one job they replaced. This asserts that the shards partition the suite
  # exactly: every collected test in exactly one shard, none dropped, none run twice.
  shard-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --extra dev --extra proof --extra validator --frozen
      - name: Shards partition the suite
        run: uv run python tests/shards.py verify

  cpu-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build CPU execution image
        run: docker build --tag spark-hermes:cpu-check .
      - name: Offline self-check as the container user
        run: docker run --rm --network none --entrypoint /opt/spark/.venv/bin/spark-hermes spark-hermes:cpu-check selfcheck
      - name: Verify benchmark entrypoint
        run: docker run --rm --network none spark-hermes:cpu-check --suite v0,v1 --workspace-root /tmp/tasks --list
