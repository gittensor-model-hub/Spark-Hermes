name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Least privilege: this job runs untrusted PR code (the test suite), so it gets a
# read-only token and no secrets. Never use pull_request_target here — the code /
# quality gate must not expose credentials to fork PRs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        # --extra validator so pyright can resolve validator/ imports (fastapi), the same
        # reason as proof below: an unresolvable import is a type error, and excluding the
        # package instead would stop type-checking the one process that serves requests.
        # --extra proof so pyright can resolve proof/ imports (pyjwt, dcap-qvl,
        # nv-attestation-sdk). SparkProof itself is not installed here, so the tests
        # that need it skip by design (see tests/conftest.py) — no secret exposure.
        run: uv sync --extra dev --extra proof --extra validator --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright type check
        run: uv run pyright

      - name: Pytest
        run: uv run pytest -q
