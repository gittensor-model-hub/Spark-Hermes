[project]
name = "spark-hermes"
version = "2.0.0"
description = "SN74 Spark-Hermes: a strategy competition on one pinned agent, with a validator that pays for beating the baseline"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub>=1.27.0",
    "substrate-interface>=1.8.1",
]

[project.optional-dependencies]
dev = [
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sh"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Published artefacts (rounds/, the site, submissions) are what the loop and miners wrote, not code to format:
# a scorecard's "check it yourself" snippet must stay as published.
extend-exclude = ["rounds", "docs", "submissions"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["sh"]
# The runner runs inside the pinned image, where `predicates` and `run_agent` resolve; not here.
exclude = ["sh/validator/runner"]
pythonVersion = "3.12"
