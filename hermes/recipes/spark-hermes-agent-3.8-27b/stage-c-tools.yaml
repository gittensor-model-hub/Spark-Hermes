# Stage C -- tool reliability.
#
# Narrow, low-LR pass over executed trajectories only. Stage B teaches the shape of
# agentic behavior from a mixed corpus; Stage C tightens the mechanics -- correct tool
# choice, well-formed arguments, no invented tools -- and it does that on rows whose
# tool outputs were really observed (`metadata.executed = true`), because this is the
# stage that decides whether the model believes its own predictions about the world.
#
#   scripts/train.sh recipes/spark-hermes-agent-3.8-27b/stage-c-tools.yaml

# Pinned in hermes/base_model.json; tests/test_base_model.py keeps them in step.
base_model: Qwen/Qwen3.6-27B
base_model_revision: 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
trust_remote_code: true

chat_template: qwen3_5
roles_to_train: ["assistant"]

datasets:
  - path: data/processed/hermes_executed_sft.jsonl
    type: chat_template
    field_messages: messages

dataset_prepared_path: data/prepared/spark-hermes-27b-stage-c
val_set_size: 0.05
output_dir: outputs/spark-hermes-agent-3.8-27b/stage-c

sequence_len: 16384
sample_packing: true
pad_to_sequence_len: true

adapter: qlora
load_in_4bit: true
lora_model_dir: outputs/spark-hermes-agent-3.8-27b/stage-b
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

gradient_accumulation_steps: 16
micro_batch_size: 1
# One epoch at a low LR: this is a refinement pass, and hammering a small executed-only
# corpus is a fast way to overfit to the handful of tasks that produced it.
num_epochs: 1
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 2.0e-5
warmup_ratio: 0.05
weight_decay: 0.0

bf16: true
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
attn_implementation: flash_attention_2

evals_per_epoch: 4
saves_per_epoch: 1
logging_steps: 10

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
