# Stage A -- reasoning repair.
#
# Teaches planning, decomposition and debugging before any tool behavior is layered on.
# The order is load-bearing: stage B on a model that cannot plan produces a model that
# calls tools confidently and wrongly.
#
#   scripts/train.sh recipes/spark-hermes-agent-3.8-27b/stage-a-reasoning.yaml
#
# Base model pinned to a revision, not a name -- see hermes/base_model.json, which this
# must agree with (tests/test_base_model.py). Qwen3.8-27B is the Phase 1 target and is not
# published: the only repositories under that name are third-party derivatives with no
# official base. Phase 0 validates the pipeline on 3.6, which exists.
#
# Nothing in this directory has been trained yet. See docs/roadmap-hermes.md.

base_model: Qwen/Qwen3.6-27B
base_model_revision: 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
trust_remote_code: true

chat_template: qwen3_5
roles_to_train: ["assistant"]

datasets:
  - path: data/processed/stage_a_reasoning_sft.jsonl
    type: chat_template
    field_messages: messages

dataset_prepared_path: data/prepared/spark-hermes-27b-stage-a
val_set_size: 0.02
output_dir: outputs/spark-hermes-agent-3.8-27b/stage-a

sequence_len: 8192
sample_packing: true
pad_to_sequence_len: true

# QLoRA on attention projections only, per the Phase 0 plan: a 27B base in 4-bit plus
# adapters fits one RTX PRO 6000 Blackwell (96 GB) at this sequence length.
adapter: qlora
load_in_4bit: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

gradient_accumulation_steps: 8
micro_batch_size: 1
num_epochs: 2
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 1.0e-4
warmup_ratio: 0.03
weight_decay: 0.0

bf16: true
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
attn_implementation: flash_attention_2

evals_per_epoch: 4
saves_per_epoch: 2
logging_steps: 10

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
