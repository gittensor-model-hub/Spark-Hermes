# Stage A -- reasoning repair.
#
# Teaches planning, decomposition and debugging before any tool behavior is layered on.
# The order is load-bearing: stage B on a model that cannot plan produces a model that
# calls tools confidently and wrongly.
#
#   scripts/train.sh recipes/spark-hermes-glimmer-30b/stage-a-reasoning.yaml
#
# Base model pinned to a revision, not a name -- see hermes/base_model.json, which this
# must agree with (tests/test_base_model.py). Qwen3.8-27B is the Phase 1 target and is not
# published: the only repositories under that name are third-party derivatives with no
# official base. Phase 0 validates the pipeline on 3.6, which exists.
#
# Nothing in this directory has been trained yet. See docs/roadmap-hermes.md.

base_model: meta-models/Muse-Glimmer-30B
base_model_revision: 97c77dff50b2797bcc558fa2d909761dbc575c59
trust_remote_code: true

chat_template: chat_template.jinja
roles_to_train: ["assistant"]

datasets:
  - path: data/processed/stage_a_reasoning_sft.jsonl
    type: chat_template
    field_messages: messages

dataset_prepared_path: data/prepared/spark-hermes-27b-stage-a
val_set_size: 0.02
output_dir: outputs/spark-hermes-glimmer-30b/stage-a

sequence_len: 8192
sample_packing: true
pad_to_sequence_len: true

# LoRA on a BF16 base, not QLoRA on a 4-bit one.
#
# The canonical served model is BF16, so training against a 4-bit copy trains adapters for a base
# that is not the base anyone runs. The adapters merge back into BF16 either way, so the mismatch
# is silent -- it does not show up as an error, only as adapters fitted to quantization noise the
# served model does not have.
#
# QLoRA is the right answer when memory is the constraint. Here it is not: 54 GB of BF16 weights
# on a 96 GB card leaves room for rank-32 adapters, their optimizer state and checkpointed
# activations at this sequence length. Measure before raising `sequence_len` -- the headroom is
# real but not large, and 16K is where it gets tight.
adapter: lora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

gradient_accumulation_steps: 8
micro_batch_size: 1
num_epochs: 2
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 1.0e-4
warmup_ratio: 0.03
weight_decay: 0.0

bf16: true
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
attn_implementation: flash_attention_2

evals_per_epoch: 4
saves_per_epoch: 2
logging_steps: 10

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
