# Stage C -- tool reliability.
#
# Narrow, low-LR pass over executed trajectories only. Stage B teaches the shape of
# agentic behavior from a mixed corpus; Stage C tightens the mechanics -- correct tool
# choice, well-formed arguments, no invented tools -- and it does that on rows whose
# tool outputs were really observed (`metadata.executed = true`), because this is the
# stage that decides whether the model believes its own predictions about the world.
#
#   scripts/train.sh recipes/spark-hermes-glimmer-30b/stage-c-tools.yaml

# Pinned in hermes/base_model.json; tests/test_base_model.py keeps them in step.
base_model: meta-models/Muse-Glimmer-30B
base_model_revision: 97c77dff50b2797bcc558fa2d909761dbc575c59
trust_remote_code: true

chat_template: chat_template.jinja
roles_to_train: ["assistant"]

datasets:
  - path: data/processed/hermes_executed_sft.jsonl
    type: chat_template
    field_messages: messages

dataset_prepared_path: data/prepared/spark-hermes-27b-stage-c
val_set_size: 0.05
output_dir: outputs/spark-hermes-glimmer-30b/stage-c

sequence_len: 8192
sample_packing: true
pad_to_sequence_len: true

# LoRA on a BF16 base, not QLoRA on a 4-bit one.
#
# The canonical served model is BF16, so training against a 4-bit copy trains adapters for a base
# that is not the base anyone runs. The adapters merge back into BF16 either way, so the mismatch
# is silent -- it does not show up as an error, only as adapters fitted to quantization noise the
# served model does not have.
#
# QLoRA is the right answer when memory is the constraint. Here it is not: 54 GB of BF16 weights
# on a 96 GB card leaves room for rank-32 adapters, their optimizer state and checkpointed
# activations at this sequence length. Measure before raising `sequence_len` -- the headroom is
# real but not large, and 16K is where it gets tight.
adapter: lora
lora_model_dir: outputs/spark-hermes-glimmer-30b/stage-b
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

gradient_accumulation_steps: 16
micro_batch_size: 1
# One epoch at a low LR: this is a refinement pass, and hammering a small executed-only
# corpus is a fast way to overfit to the handful of tasks that produced it.
num_epochs: 1
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 2.0e-5
warmup_ratio: 0.05
weight_decay: 0.0

bf16: true
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
attn_implementation: flash_attention_2

evals_per_epoch: 4
saves_per_epoch: 1
logging_steps: 10

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
