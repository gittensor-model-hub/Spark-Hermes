# Stage A -- reasoning repair.
#
# Teaches planning, decomposition and debugging before any tool behavior is layered on.
# The order is load-bearing: stage B on a model that cannot plan produces a model that
# calls tools confidently and wrongly.
#
#   scripts/train.sh recipes/spark-hermes-3.8-27b/stage-a-reasoning.yaml
#
# Base model pinned to a revision, not a name -- see hermes/base_model.json, which this
# must agree with (tests/test_base_model.py). The final target is the pinned official
# Qwen3.8-27B base below. The CPU preparation/4B POC profile separately pins Qwen3.5-4B
# in rtx5090-poc.yaml; CPU validation does not prove GPU training or serving compatibility.
#
# Nothing in this directory has been trained yet. See docs/roadmap-hermes.md.

base_model: Qwen/Qwen3.8-27B
base_model_revision: 1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
trust_remote_code: true

chat_template: tokenizer_default
roles_to_train: ["assistant"]

datasets:
  - path: data/processed/stage_a_reasoning_sft.jsonl
    type: chat_template
    field_messages: messages

dataset_prepared_path: data/prepared/spark-hermes-27b-stage-a
val_set_size: 0.02
output_dir: outputs/spark-hermes-3.8-27b/stage-a

sequence_len: 8192
sample_packing: true
pad_to_sequence_len: true

# LoRA on a BF16 base, not QLoRA on a 4-bit one.
#
# The canonical served model is BF16, so training against a 4-bit copy trains adapters for a base
# that is not the base anyone runs. The adapters merge back into BF16 either way, so the mismatch
# is silent -- it does not show up as an error, only as adapters fitted to quantization noise the
# served model does not have.
#
# QLoRA is the right answer when memory is the constraint. Here it is not: 56 GB of BF16 weights
# on a 96 GB card leaves room for rank-32 adapters, their optimizer state and checkpointed
# activations at this sequence length. Measure before raising `sequence_len` -- the headroom is
# real but not large, and 16K is where it gets tight.
adapter: lora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj

gradient_accumulation_steps: 8
micro_batch_size: 1
num_epochs: 2
optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 1.0e-4
warmup_ratio: 0.03
weight_decay: 0.0

bf16: true
tf32: true
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
attn_implementation: flash_attention_2

evals_per_epoch: 4
saves_per_epoch: 2
logging_steps: 10

plugins:
  - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin
