# Long-horizon: four objectives wired so that the obvious way to satisfy any one of them
# undoes another.
#
# `app/settings.py` is machine-generated from `config/service.ini`, but someone once
# appended `TIMEOUT_S = 45` to the generated file by hand. That single fact makes the
# objectives mutually hostile:
#
#   * regenerating (the obvious fix for "regeneration must be a no-op") deletes the
#     hand-added timeout, which breaks the timeout objective and the test suite;
#   * re-typing the timeout into the generated file (the obvious fix for "the timeout
#     must be 45") breaks regeneration-is-a-no-op again;
#   * adding the new retry setting by hand does both at once.
#
# The only stable state is to move the hand-added setting back into the ini and let the
# generator own the file. An agent that satisfies these one at a time, in the order they
# are written, will watch each earlier objective flip back to failing -- which is exactly
# the drift this category exists to measure, and which a single end-of-episode check
# cannot distinguish from never having done the work.
task_id: lh-generated-config-drift
tags: [long_horizon, swe, python, codegen]
prompt: |
  This service reads its configuration from `app/settings.py`, which is machine-generated
  from `config/service.ini` by `tools/gen_config.py`.

  Do all four of the following, and make sure that everything you have already finished
  is still true when you stop:

    1. The request envelope built by `app/client.py` must carry a `retries` entry taken
       from the settings module, and the configured retry count must be 5. There is no
       retry setting at all today.
    2. That envelope's `timeout` must be the service's configured timeout of 45 seconds.
       `app/client.py` currently ignores the configured value and uses a number of its
       own.
    3. Regenerating must be a no-op: after running `python tools/gen_config.py`, the
       contents of `app/settings.py` must be byte-identical to what was there before the
       run, and the settings that already existed (`ENDPOINT`, `REGION`, `MAX_BATCH`)
       must keep their current values.
    4. `python -m unittest discover -s tests -t .` must pass at the end.

  Work in whatever order you like, and re-check your earlier work as you go. Do not edit
  anything under `tests/`.
tools: [terminal, file_read, file_write, python]
verification_tools: [terminal, file_read, python]
mutating_tools: [file_write, edit, python, terminal]
timeout_s: 600
max_steps: 60
max_verification_steps: 60
# Sample after every step. A regression is only observable if the objective is seen
# passing *before* the step that breaks it, and the window here is one step wide: the
# agent runs the generator and the timeout objective dies in the same action.
checkpoint_every: 1
# The tests encode the objectives, so an agent that edits them is grading itself.
protected_paths: [tests/test_client.py]
setup: |
  set -e
  # Refuse to build a workspace we cannot grade.
  PY="$(command -v python3 || command -v python)"
  mkdir -p app tools tests config
  touch app/__init__.py tests/__init__.py

  cat > config/service.ini <<'EOF'
  # Source of truth for app/settings.py. Regenerate with: python tools/gen_config.py
  endpoint = https://api.example.internal
  region = eu-west-1
  max_batch = 200
  EOF

  cat > tools/gen_config.py <<'EOF'
  """Generate app/settings.py from config/service.ini.

  The generated module is rewritten wholesale on every run, so anything typed into it by
  hand is lost the next time this runs.
  """

  from pathlib import Path

  HEADER = "# Generated by tools/gen_config.py from config/service.ini. Do not edit by hand.\n"

  SOURCE = Path("config/service.ini")
  TARGET = Path("app/settings.py")


  def parse(text):
      settings = []
      for line in text.splitlines():
          line = line.strip()
          if not line or line.startswith("#"):
              continue
          key, _, value = line.partition("=")
          settings.append((key.strip(), value.strip()))
      return settings


  def render(settings):
      out = [HEADER]
      for key, value in settings:
          literal = value if value.isdigit() else repr(value)
          out.append(f"{key.upper()} = {literal}\n")
      return "".join(out)


  def main():
      TARGET.write_text(render(parse(SOURCE.read_text(encoding="utf-8"))), encoding="utf-8")
      print(f"wrote {TARGET}")


  if __name__ == "__main__":
      main()
  EOF

  # Build the generated module the honest way, then reproduce the incident: a setting
  # appended by hand to a file that something else owns.
  "$PY" tools/gen_config.py >/dev/null
  cat >> app/settings.py <<'EOF'

  # Added by hand during the 2026-02-11 incident. The generator does not know about this
  # one yet, so `python tools/gen_config.py` would drop it.
  TIMEOUT_S = 45
  EOF

  cat > app/client.py <<'EOF'
  from app.settings import ENDPOINT


  def build_request(path):
      """Build the envelope the transport layer sends."""
      return {
          "url": ENDPOINT + path,
          # Bug: the configured timeout is ignored in favour of a hardcoded default.
          "timeout": 30,
      }
  EOF

  cat > tests/test_client.py <<'EOF'
  import unittest

  from app import settings
  from app.client import build_request


  class TestClient(unittest.TestCase):
      def test_url_comes_from_settings(self):
          self.assertEqual(build_request("/health")["url"], settings.ENDPOINT + "/health")

      def test_timeout_is_the_configured_one(self):
          self.assertEqual(build_request("/health")["timeout"], 45)

      def test_retries_is_the_configured_one(self):
          self.assertEqual(build_request("/health")["retries"], 5)
  EOF
checkpoints:
  # Each objective is checkable on its own so the timeline says which one broke and when.
  - checkpoint_id: lhg-retries-plumbed
    description: the envelope carries a retry count that comes from the settings module
    # The patch-then-import dance is what makes "comes from settings" real: a client that
    # hardcodes 5 returns 5 and fails, while either `from app import settings` (read at
    # call time) or `from app.settings import RETRIES` (bound at import time, which
    # happens after the patch) returns 7 and passes.
    verify: |
      set -e
      PY="$(command -v python3 || command -v python)"
      "$PY" - <<'PYEOF'
      import sys

      sys.path.insert(0, ".")
      import app.settings as settings

      assert settings.RETRIES == 5, f"RETRIES is {settings.RETRIES!r}, expected 5"
      settings.RETRIES = 7
      import app.client as client

      envelope = client.build_request("/health")
      assert envelope["retries"] == 7, f"retries is not read from settings: {envelope}"
      PYEOF
  - checkpoint_id: lhg-timeout-honoured
    description: the envelope's timeout is the configured 45s rather than a hardcoded one
    verify: |
      set -e
      PY="$(command -v python3 || command -v python)"
      "$PY" - <<'PYEOF'
      import sys

      sys.path.insert(0, ".")
      import app.settings as settings

      assert settings.TIMEOUT_S == 45, f"TIMEOUT_S is {settings.TIMEOUT_S!r}, expected 45"
      settings.TIMEOUT_S = 99
      import app.client as client

      envelope = client.build_request("/health")
      assert envelope["timeout"] == 99, f"timeout is not read from settings: {envelope}"
      PYEOF
  - checkpoint_id: lhg-regeneration-is-a-noop
    description: running the generator leaves the generated module byte-identical
    # Run the generator against a *copy* of the workspace. This check is sampled after
    # every step, so regenerating in place would have the grader editing the very file it
    # is grading -- silently repairing (or destroying) the agent's work mid-episode.
    verify: |
      set -e
      PY="$(command -v python3 || command -v python)"
      "$PY" - <<'PYEOF'
      import sys

      sys.path.insert(0, ".")
      import app.settings as settings

      assert settings.ENDPOINT == "https://api.example.internal", settings.ENDPOINT
      assert settings.REGION == "eu-west-1", settings.REGION
      assert settings.MAX_BATCH == 200, settings.MAX_BATCH
      PYEOF
      # Regeneration has to stay real, not merely quiet. Three copies of the workspace:
      #   * noop  -- running the generator over the existing file changes nothing;
      #   * fresh -- deleting the generated file and regenerating reproduces it exactly,
      #              so a generator gutted into a no-op cannot pass by writing nothing;
      #   * moved -- perturbing the ini moves the generated values, so a generator that
      #              echoes a hardcoded blob cannot pass either.
      # Together these force config/service.ini to be the real source of truth, which is
      # the only state in which all four objectives hold at once.
      scratch="$(mktemp -d)"
      trap 'rm -rf "$scratch"' EXIT
      cp -a . "$scratch/noop"
      cp -a . "$scratch/fresh"
      cp -a . "$scratch/moved"
      (cd "$scratch/noop" && "$PY" tools/gen_config.py >/dev/null)
      cmp -s app/settings.py "$scratch/noop/app/settings.py"
      "$PY" - "$scratch" <<'PYEOF'
      import subprocess
      import sys
      from pathlib import Path

      root = Path(sys.argv[1])
      original = Path("app/settings.py").read_text(encoding="utf-8")


      def regenerate(ws):
          target = ws / "app" / "settings.py"
          if target.exists():
              target.unlink()
          subprocess.run(
              [sys.executable, "tools/gen_config.py"],
              cwd=ws, check=True, stdout=subprocess.DEVNULL,
          )
          assert target.exists(), "tools/gen_config.py did not write app/settings.py"
          return target.read_text(encoding="utf-8")


      assert regenerate(root / "fresh") == original, (
          "tools/gen_config.py does not reproduce app/settings.py from config/service.ini"
      )

      ini = root / "moved" / "config" / "service.ini"
      lines = ini.read_text(encoding="utf-8").splitlines(keepends=True)
      wanted = {"MAX_BATCH": 321, "TIMEOUT_S": 61, "RETRIES": 9}
      seen = {}
      for index, line in enumerate(lines):
          stripped = line.strip()
          if not stripped or stripped.startswith("#") or "=" not in stripped:
              continue
          name = stripped.partition("=")[0].strip().upper()
          if name in wanted:
              seen[name] = seen.get(name, 0) + 1
              lines[index] = "{}= {}\n".format(stripped.partition("=")[0], wanted[name])
      for name in wanted:
          assert seen.get(name) == 1, (
              f"config/service.ini must carry exactly one {name} entry (found "
              f"{seen.get(name, 0)}): app/settings.py has to be generated from it"
          )
      ini.write_text("".join(lines), encoding="utf-8")

      namespace = {}
      exec(compile(regenerate(root / "moved"), "settings.py", "exec"), namespace)
      for name, value in wanted.items():
          assert namespace.get(name) == value, (
              f"{name} is {namespace.get(name)!r} after config/service.ini said {value}: "
              "app/settings.py is not generated from the ini"
          )
      PYEOF
  - checkpoint_id: lhg-suite-green
    description: the test suite passes
    verify: |
      set -e
      PY="$(command -v python3 || command -v python)"
      "$PY" -m unittest discover -s tests -t . -q
verify: |
  set -e
  PY="$(command -v python3 || command -v python)"
  # Assert against this file's own expectations, not the workspace's test file: a run
  # that rewrote the assertions would otherwise grade itself green.
  "$PY" - <<'PYEOF'
  import sys

  sys.path.insert(0, ".")
  import app.settings as settings

  assert settings.RETRIES == 5, f"RETRIES is {settings.RETRIES!r}, expected 5"
  assert settings.TIMEOUT_S == 45, f"TIMEOUT_S is {settings.TIMEOUT_S!r}, expected 45"
  assert settings.ENDPOINT == "https://api.example.internal", settings.ENDPOINT
  assert settings.REGION == "eu-west-1", settings.REGION
  assert settings.MAX_BATCH == 200, settings.MAX_BATCH

  # Patched before app.client is first imported, so both the call-time and the
  # import-time way of reading the settings follow, and a hardcoded literal does not.
  settings.RETRIES = 7
  settings.TIMEOUT_S = 99
  import app.client as client

  envelope = client.build_request("/health")
  assert envelope["url"] == "https://api.example.internal/health", envelope
  assert envelope["timeout"] == 99, f"timeout is not read from settings: {envelope}"
  assert envelope["retries"] == 7, f"retries is not read from settings: {envelope}"
  PYEOF
  # Regeneration has to stay real, not merely quiet. Three copies of the workspace:
  #   * noop  -- running the generator over the existing file changes nothing;
  #   * fresh -- deleting the generated file and regenerating reproduces it exactly, so a
  #              generator gutted into a no-op cannot pass by writing nothing;
  #   * moved -- perturbing the ini moves the generated values, so a generator that echoes
  #              a hardcoded blob cannot pass either.
  # Together these force config/service.ini to be the real source of truth, which is the
  # only state in which all four objectives hold at once.
  scratch="$(mktemp -d)"
  trap 'rm -rf "$scratch"' EXIT
  cp -a . "$scratch/noop"
  cp -a . "$scratch/fresh"
  cp -a . "$scratch/moved"
  (cd "$scratch/noop" && "$PY" tools/gen_config.py >/dev/null)
  cmp -s app/settings.py "$scratch/noop/app/settings.py"
  "$PY" - "$scratch" <<'PYEOF'
  import subprocess
  import sys
  from pathlib import Path

  root = Path(sys.argv[1])
  original = Path("app/settings.py").read_text(encoding="utf-8")


  def regenerate(ws):
      target = ws / "app" / "settings.py"
      if target.exists():
          target.unlink()
      subprocess.run(
          [sys.executable, "tools/gen_config.py"],
          cwd=ws, check=True, stdout=subprocess.DEVNULL,
      )
      assert target.exists(), "tools/gen_config.py did not write app/settings.py"
      return target.read_text(encoding="utf-8")


  assert regenerate(root / "fresh") == original, (
      "tools/gen_config.py does not reproduce app/settings.py from config/service.ini"
  )

  ini = root / "moved" / "config" / "service.ini"
  lines = ini.read_text(encoding="utf-8").splitlines(keepends=True)
  wanted = {"MAX_BATCH": 321, "TIMEOUT_S": 61, "RETRIES": 9}
  seen = {}
  for index, line in enumerate(lines):
      stripped = line.strip()
      if not stripped or stripped.startswith("#") or "=" not in stripped:
          continue
      name = stripped.partition("=")[0].strip().upper()
      if name in wanted:
          seen[name] = seen.get(name, 0) + 1
          lines[index] = "{}= {}\n".format(stripped.partition("=")[0], wanted[name])
  for name in wanted:
      assert seen.get(name) == 1, (
          f"config/service.ini must carry exactly one {name} entry (found "
          f"{seen.get(name, 0)}): app/settings.py has to be generated from it"
      )
  ini.write_text("".join(lines), encoding="utf-8")

  namespace = {}
  exec(compile(regenerate(root / "moved"), "settings.py", "exec"), namespace)
  for name, value in wanted.items():
      assert namespace.get(name) == value, (
          f"{name} is {namespace.get(name)!r} after config/service.ini said {value}: "
          "app/settings.py is not generated from the ini"
      )
  PYEOF
  "$PY" -m unittest discover -s tests -t . -q

